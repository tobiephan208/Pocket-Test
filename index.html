<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Locket Widget Clone</title>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #ff9f0a;
      --btn-bg: rgba(255, 255, 255, 0.15);
    }

    /* Các theme màu */
    body.theme-orange {
      --bg-color: #ffaa33;
      --card-bg: #e69526;
      --text-color: #ffffff;
      --accent-color: #ffffff;
    }
    body.theme-pink {
      --bg-color: #fbcfe8;
      --card-bg: #f472b6;
      --text-color: #831843;
      --accent-color: #db2777;
    }
    body.theme-black {
      --bg-color: #000000;
      --card-bg: #18181b;
      --text-color: #ffffff;
      --accent-color: #a1a1aa;
    }
    body.theme-white {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --text-color: #09090b;
      --accent-color: #18181b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      transition: background-color 0.3s, color 0.3s;
      overflow: hidden;
    }

    /* Thanh điều hướng trên cùng */
    .top-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .icon-btn {
      background: var(--btn-bg);
      border: none;
      color: var(--text-color);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .theme-selector {
      display: flex;
      gap: 6px;
      background: var(--btn-bg);
      padding: 4px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .theme-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .theme-dot.active {
      border-color: var(--text-color);
    }

    /* Khung Viewfinder Camera dạng Widget */
    .viewfinder-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      border-radius: 48px;
      overflow: hidden;
      position: relative;
      background-color: #000;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    }

    #video, #photo-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #video.mirror {
      transform: scaleX(-1);
    }

    #photo-preview {
      display: none;
    }

    .badge-friends {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.4);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
    }

    /* Thanh điều khiển chụp */
    .controls {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
    }

    .action-row {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .shutter-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 5px solid var(--text-color);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      background: var(--text-color);
      border-radius: 50%;
      transition: transform 0.1s;
    }

    .shutter-btn:active .shutter-inner {
      transform: scale(0.85);
    }

    .send-btn {
      background: var(--text-color);
      color: var(--bg-color);
      padding: 14px 32px;
      border-radius: 30px;
      font-weight: bold;
      border: none;
      font-size: 16px;
      display: none;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .history-row {
      display: flex;
      gap: 12px;
      align-items: center;
      opacity: 0.8;
    }

    .history-item {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--btn-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
  </style>
</head>
<body class="theme-black">

  <!-- Top Navigation -->
  <div class="top-bar">
    <button class="icon-btn" id="flash-btn" onclick="toggleFlash()">
      <i class="ph ph-lightning-slash"></i>
    </button>

    <!-- Theme Switcher -->
    <div class="theme-selector">
      <div class="theme-dot active" style="background: #000000;" onclick="setTheme('black', this)"></div>
      <div class="theme-dot" style="background: #ffaa33;" onclick="setTheme('orange', this)"></div>
      <div class="theme-dot" style="background: #fbcfe8;" onclick="setTheme('pink', this)"></div>
      <div class="theme-dot" style="background: #ffffff;" onclick="setTheme('white', this)"></div>
    </div>

    <button class="icon-btn">
      <i class="ph ph-user-plus"></i>
    </button>
  </div>

  <!-- Camera / Widget Viewfinder -->
  <div class="viewfinder-container">
    <video id="video" autoplay playsinline></video>
    <img id="photo-preview" alt="Preview" />
    <div class="badge-friends">
      <i class="ph ph-users-three"></i> Bạn bè
    </div>
  </div>

  <!-- Bottom Controls -->
  <div class="controls">
    <div class="action-row">
      <button class="icon-btn" onclick="retakePhoto()" id="retake-btn" style="visibility: hidden;">
        <i class="ph ph-x"></i>
      </button>

      <!-- Main Capture Button -->
      <button class="shutter-btn" id="shutter-btn" onclick="takePhoto()">
        <div class="shutter-inner"></div>
      </button>

      <!-- Send Button (Shown after capture) -->
      <button class="send-btn" id="send-btn" onclick="sendToDiscord()">
        Gửi <i class="ph ph-paper-plane-right-fill"></i>
      </button>

      <button class="icon-btn" id="switch-cam-btn" onclick="switchCamera()">
        <i class="ph ph-cameraswitch"></i>
      </button>
    </div>

    <!-- Decorative History Bar -->
    <div class="history-row">
      <div class="history-item"><i class="ph ph-clock-counter-clockwise"></i></div>
      <span style="font-size: 12px; font-weight: 500;">Khoảnh khắc vừa ghi</span>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1530830759496253591/Pbzj6XovoFjAyAqjYSOvFYkaFk1UP1wRRYU3HFSN8VFNCFTIWx4rhk7mWeECi4_aicI2";

    const video = document.getElementById('video');
    const photoPreview = document.getElementById('photo-preview');
    const canvas = document.getElementById('canvas');
    const shutterBtn = document.getElementById('shutter-btn');
    const sendBtn = document.getElementById('send-btn');
    const retakeBtn = document.getElementById('retake-btn');
    const switchCamBtn = document.getElementById('switch-cam-btn');

    let currentStream = null;
    let facingMode = 'user'; // Ưu tiên camera trước
    let capturedBlob = null;

    // Khởi tạo Camera
    async function initCamera() {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      const constraints = {
        video: {
          facingMode: facingMode,
          width: { ideal: 1080 },
          height: { ideal: 1080 }
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        
        if (facingMode === 'user') {
          video.classList.add('mirror');
        } else {
          video.classList.remove('mirror');
        }
      } catch (err) {
        alert("Không thể truy cập camera. Vui lòng cấp quyền sử dụng camera trên trình duyệt.");
      }
    }

    // Đổi Camera trước/sau
    function switchCamera() {
      facingMode = (facingMode === 'user') ? 'environment' : 'user';
      initCamera();
    }

    // Chụp ảnh
    function takePhoto() {
      const context = canvas.getContext('2d');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 640;

      // Xử lý lật ảnh nếu là camera trước
      if (facingMode === 'user') {
        context.translate(canvas.width, 0);
        context.scale(-1, 1);
      }

      context.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        capturedBlob = blob;
        const imageUrl = URL.createObjectURL(blob);
        photoPreview.src = imageUrl;

        // Chuyển UI sang chế độ xem lại ảnh
        video.style.display = 'none';
        photoPreview.style.display = 'block';
        shutterBtn.style.display = 'none';
        switchCamBtn.style.visibility = 'hidden';
        sendBtn.style.display = 'flex';
        retakeBtn.style.visibility = 'visible';
      }, 'image/jpeg', 0.85);
    }

    // Chụp lại
    function retakePhoto() {
      capturedBlob = null;
      photoPreview.style.display = 'none';
      video.style.display = 'block';
      shutterBtn.style.display = 'flex';
      switchCamBtn.style.visibility = 'visible';
      sendBtn.style.display = 'none';
      retakeBtn.style.visibility = 'hidden';
    }

    // Gửi ảnh lên Discord Webhook
    async function sendToDiscord() {
      if (!capturedBlob) return;

      sendBtn.disabled = true;
      sendBtn.innerText = "Đang gửi...";

      const formData = new FormData();
      formData.append("file", capturedBlob, "locket_moment.jpg");
      formData.append("payload_json", JSON.stringify({
        content: "📸 Một khoảnh khắc mới vừa được chia sẻ từ Locket!"
      }));

      try {
        const response = await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          body: formData
        });

        if (response.ok) {
          alert("Gửi khoảnh khắc thành công!");
          retakePhoto();
        } else {
          alert("Lỗi khi gửi ảnh lên Webhook.");
        }
      } catch (error) {
        alert("Lỗi kết nối tới Discord Webhook.");
      } finally {
        sendBtn.disabled = false;
        sendBtn.innerHTML = `Gửi <i class="ph ph-paper-plane-right-fill"></i>`;
      }
    }

    // Đổi chủ đề màu
    function setTheme(themeName, element) {
      document.body.className = `theme-${themeName}`;
      document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
      element.classList.add('active');
    }

    // Đổi biểu tượng Flash
    function toggleFlash() {
      const btn = document.getElementById('flash-btn');
      const icon = btn.querySelector('i');
      if (icon.classList.contains('ph-lightning-slash')) {
        icon.className = 'ph ph-lightning';
      } else {
        icon.className = 'ph ph-lightning-slash';
      }
    }

    // Chạy camera khi mở trang
    window.addEventListener('DOMContentLoaded', initCamera);
  </script>
</body>
</html>
